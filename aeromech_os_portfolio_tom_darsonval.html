            <div class="flex items-center gap-2">
              <div class="flex items-center gap-1.5 mr-2">
                <button onclick="closeApp('${app.id}')" title="Fermer" class="w-3 h-3 rounded-full bg-rose-500 hover:bg-rose-400 transition"></button>
                <button onclick="minimizeApp('${app.id}')" title="Réduire" class="w-3 h-3 rounded-full bg-amber-400 hover:bg-amber-300 transition"></button>
                <button onclick="maximizeApp('${app.id}')" title="Agrandir" class="hidden sm:inline-block w-3 h-3 rounded-full bg-emerald-500 hover:bg-emerald-400 transition"></button>
              </div>
              <span class="font-mono text-xs text-slate-200 font-medium truncate">${appMeta.title}</span>
            </div>
            <button onclick="closeApp('${app.id}')" class="sm:hidden text-xs font-mono text-slate-400 hover:text-white px-2 py-1">✕</button>
          </div>

          <!-- Window Body -->
          <div class="flex-1 overflow-y-auto os-scroll">
            ${renderWindowContent(app.id)}
          </div>
        `;

        container.appendChild(win);
        if (!isMobile) {
          makeDraggable(win, app);
        }
      });
    }

    // ==========================================
    // 6. INTERACTION & WINDOW CONTROLS
    // ==========================================
    function openApp(id) {
      const app = appConfigs.find(a => a.id === id);
      if (!app) return;
      // On mobile, close other windows to keep screen clean
      if (window.innerWidth < 768) {
        appConfigs.forEach(a => { if (a.id !== id) a.isOpen = false; });
      }
      app.isOpen = true;
      app.isMinimized = false;
      app.zIndex = ++highestZ;
      renderDesktop();
    }

    function closeApp(id) {
      const app = appConfigs.find(a => a.id === id);
      if (app) {
        app.isOpen = false;
        app.isMaximized = false;
        renderDesktop();
      }
    }

    function minimizeApp(id) {
      const app = appConfigs.find(a => a.id === id);
      if (app) {
        app.isMinimized = true;
        renderDesktop();
      }
    }

    function maximizeApp(id) {
      const app = appConfigs.find(a => a.id === id);
      if (app) {
        app.isMaximized = !app.isMaximized;
        app.zIndex = ++highestZ;
        renderWindows();
      }
    }

    function toggleDockApp(id) {
      const app = appConfigs.find(a => a.id === id);
      if (!app) return;
      if (!app.isOpen) {
        openApp(id);
      } else if (app.isMinimized) {
        app.isMinimized = false;
        app.zIndex = ++highestZ;
        renderDesktop();
      } else {
        minimizeApp(id);
      }
    }

    function focusWindow(id) {
      const app = appConfigs.find(a => a.id === id);
      if (app && app.zIndex !== highestZ) {
        app.zIndex = ++highestZ;
        const winEl = document.getElementById(`win-${id}`);
        if (winEl) winEl.style.zIndex = app.zIndex;
      }
    }

    function makeDraggable(winEl, app) {
      const header = winEl.querySelector('.win-header');
      let isDragging = false;
      let startX, startY, origLeft, origTop;

      header.addEventListener('mousedown', (e) => {
        if (e.target.tagName === 'BUTTON' || app.isMaximized) return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        origLeft = winEl.offsetLeft;
        origTop = winEl.offsetTop;
        focusWindow(app.id);
      });

      window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        const newLeft = Math.max(0, Math.min(window.innerWidth - 150, origLeft + dx));
        const newTop = Math.max(0, Math.min(window.innerHeight - 120, origTop + dy));
        winEl.style.left = `${newLeft}px`;
        winEl.style.top = `${newTop}px`;
        app.defaultPos.left = newLeft;
        app.defaultPos.top = newTop;
      });

      window.addEventListener('mouseup', () => {
        isDragging = false;
      });
    }

    // ==========================================
    // 7. APP-SPECIFIC ACTIONS & UTILITIES
    // ==========================================
    function setLanguage(lang) {
      currentLang = lang;
      document.getElementById('btn-lang-fr').className = lang === 'fr'
        ? 'px-2 py-0.5 rounded-md bg-sky-500 text-slate-950 font-bold transition'
        : 'px-2 py-0.5 rounded-md text-slate-400 hover:text-white transition';
      document.getElementById('btn-lang-en').className = lang === 'en'
        ? 'px-2 py-0.5 rounded-md bg-sky-500 text-slate-950 font-bold transition'
        : 'px-2 py-0.5 rounded-md text-slate-400 hover:text-white transition';

      document.querySelector('[data-i18n="statusBadge"]').textContent = i18n[lang].statusBadge;
      document.querySelector('[data-i18n="roleShort"]').textContent = i18n[lang].roleShort;
      renderDesktop();
    }

    function selectProjectTab(idx) {
      activeProjectTab = idx;
      renderWindows();
    }

    function setSkillFilter(cat) {
      selectedSkillFilter = cat;
      renderWindows();
    }

    function setCvLang(lang) {
      cvLang = lang;
      renderWindows();
    }

    function toggleStartMenu(forceState) {
      const menu = document.getElementById('start-menu');
      if (typeof forceState === 'boolean') {
        menu.classList.toggle('hidden', !forceState);
      } else {
        menu.classList.toggle('hidden');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('os-toast');
      document.getElementById('os-toast-msg').textContent = msg;
      toast.classList.remove('translate-x-full', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-x-full', 'opacity-0');
      }, 2800);
    }

    function copyText(text, successMsg) {
      const tempInput = document.createElement('input');
      tempInput.value = text;
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand('copy');
        showToast(successMsg);
      } catch (err) {
        showToast(text);
      }
      document.body.removeChild(tempInput);
    }

    function launchMailDraft() {
      const company = document.getElementById('recruiter-company')?.value || 'Votre Entreprise';
      const role = document.getElementById('recruiter-role')?.value || 'Stage PFE Ingénieur Mécanique (Mars 2027)';
      const subject = encodeURIComponent(`[Stage PFE 2027] Échange avec Tom Darsonval — ${company}`);
      const body = encodeURIComponent(
        currentLang === 'fr'
          ? `Bonjour Tom,\n\nNous avons consulté votre portfolio AeroMech OS et votre profil SIGMA Clermont / CTU Prague a retenu notre attention pour une opportunité (${role}) au sein de ${company}.\n\nSeriez-vous disponible pour un premier échange téléphonique ?\n\nCordialement,`
          : `Hello Tom,\n\nWe reviewed your AeroMech OS portfolio and your background at SIGMA Clermont / CTU Prague caught our attention for an opportunity (${role}) at ${company}.\n\nWould you be available for an introductory call?\n\nBest regards,`
      );
      window.location.href = `mailto:tom.darsonval@sigma-clermont.fr?subject=${subject}&body=${body}`;
    }

    function updateClock() {
      const now = new Date();
      const hrs = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('os-clock').textContent = `${hrs}:${mins} CET`;
    }

    // Close start menu when clicking outside
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('start-menu');
      if (!menu.classList.contains('hidden') && !menu.contains(e.target) && !e.target.closest('header')) {
        menu.classList.add('hidden');
      }
    });

    window.addEventListener('resize', () => {
      renderWindows();
    });

    // Initialize OS
    window.onload = () => {
      updateClock();
      setInterval(updateClock, 15000);
      renderDesktop();
    };
  </script>
</body>
</html>
